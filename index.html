<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="To-Do List Life Dashboard - A minimal personal productivity dashboard">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Notification Container -->
  <div id="notification-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Theme Toggle Button -->
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Switch to dark mode">
    🌙
  </button>

  <!-- Main Dashboard Content -->
  <main class="dashboard">
    <h1>To-Do List Life Dashboard</h1>
    <p>Dashboard content will be added in subsequent tasks.</p>
  </main>

  <!-- ARIA Live Regions for Screen Reader Announcements -->
  <div id="timer-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="task-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="js/script.js"></script>
</body>
</html>
